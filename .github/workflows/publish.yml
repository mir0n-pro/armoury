# Armoury -- publish the jars to GitHub Packages (Maven).
# Runs when a version tag is pushed, or by hand. GitHub Packages takes a version once: publishing the
# same version again is refused, so a fix ships as a new version.
name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 24 (Temurin) + Maven settings for GitHub Packages
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "24"
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build, test, and deploy
        run: mvn -B -ntp deploy
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
