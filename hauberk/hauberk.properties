# Hauberk -- harness configuration.
#
# One file, read from the working directory at startup. An overlay named with
# -Dhauberk.config=<file> is loaded on top of it and its keys win; a system
# property of the same name as a setting wins over both, which is what
# "hauberk run --set key=value" uses. A value may refer to another setting
# as ${other.key} and is expanded once at load.
#
# This is the GENERIC harness, so this file points at nothing: it documents
# every setting the harness itself reads, with the target-dependent ones
# commented out. A consumer (the Esquire services, the Herald messaging lab)
# ships its own file, where its own settings live beside these.

# Where the concrete Simulation classes live -- the package SimulationCatalog
# scans. The default below is this jar's own, which holds only the abstract
# base and the annotation, so an unconfigured harness discovers nothing.
simulations.package=pro.mir0n.hauberk.simulations

# --- the identity provider -------------------------------------------------
# Read on first touch only: a target that needs no credential never sets these
# and is never asked for them.
#   tokenRelay.type  plain   -- send Bearer; the edge validates the JWS itself
#                    vanilla -- send HTTP Basic; the edge runs client_credentials
#                               on the harness's behalf
#                    phantom -- send Bearer; the edge runs RFC 8693 exchange
#kc.base=http://localhost:8081/kc-auth
#kc.realm=master
#kc.client.id=
#kc.client.secret=
#tokenRelay.type=plain
# Admin-API credentials, for Simulations that manage users rather than use them.
#kc.admin.user=admin
#kc.admin.password=
#kc.admin.client.id=
# The admin client secret is read from the environment ONLY, never from a file:
# KC_ADMIN_SECRET, or KCMASTER_ADMIN_SECRET.

# --- the pre-flight probes -------------------------------------------------
# Run by "hauberk run" unless --no-health-check. A health.probe.<name> passes on
# any status below 500 -- it asks whether anything answers there at all.
# health.auth.probe is the single probe that must return 200: it presents
# whichever edge credential the run is configured for, and so smoke-tests the
# whole auth path at once. With none set, the pre-check passes and says so.
#health.probe.idp=${kc.base}/realms/${kc.realm}/.well-known/openid-configuration
#health.probe.edge=${edge.base}/actuator/health
#health.auth.probe=${edge.base}/some-protected-endpoint

# --- the performance matrix ------------------------------------------------
# Switched on per run with "hauberk run --metrics". perf.header.capture is the
# trigger the harness sends; the four below are the timing headers it reads back
# off each response, outermost first -- the edge as the client sees it, the edge's
# own inner time, the service behind it, and that service's inner time. A blank
# name means this target does not report that one, and the column comes out as -1.
perf.header.capture=X-Capture-Metrics
perf.header.gw.outer=
perf.header.gw.inner=
perf.header.srv.outer=
perf.header.srv.inner=
# Free text written into every CSV preamble and the summary line, so two runs of
# the same simulation can be told apart. A target usually points it at its client.
perf.run.label=

# --- infra commands --------------------------------------------------------
# Run AS SIM STEPS through the OS shell via Cmd.run("<key>"). This is what lets a
# Simulation drive the stack itself -- stop a broker to lose messages, restart a
# service mid-write -- with no operator. Override per target.
#cmd.stop-broker=docker stop my-broker
#cmd.start-broker=docker start my-broker
